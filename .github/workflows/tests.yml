name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install with test extras
        run: pip install -e '.[tests]' pytest-cov
      - name: Run the suite with coverage
        run: pytest tests --cov=qsiplan --cov-report=term --cov-report=xml --cov-fail-under=85
      - name: Smoke the CLI entry point
        run: qsiplan --help
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: py${{ matrix.python-version }}
          # The quality gate is pytest's --cov-fail-under; an upload hiccup
          # must never fail CI.
          fail_ci_if_error: false
