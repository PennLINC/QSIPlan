# A single DWI series with no fieldmap and only a T2w (no T1w). Expected by
# default: no correction at all (anatomical SDC is opt-in). With
# sdc_anat_reference='auto': the T2w rung of the auto ladder gives it an INFERRED
# T2Wreg estimation, which the tortoise preview states definitely and the
# fsl preview warns it cannot execute.
'01':
  - anat:
      - suffix: T2w
    dwi:
      - dir: AP
        suffix: dwi
        metadata:
          PhaseEncodingDirection: 'j-'
          TotalReadoutTime: 0.05
